<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>穿山惡龍目標價計算工具(半年內)</title>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      padding: 20px;
      background: #f4f4f9;
      line-height: 1.6;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .warning {
      margin-bottom: 20px;
      padding: 12px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 11px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input:disabled {
      background: #f1f1f1;
      color: #777;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #d9534f;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .result-box {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      border-left: 5px solid #007bff;
    }

    .fail-box {
      background: #fff0f0;
      border-left-color: #d9534f;
    }

    .quote-box {
      background: #fff8e7;
      border-left-color: #f0ad4e;
    }

    .not-cross-box {
      background: #fff0f0;
      border-left-color: #d9534f;
    }

    .target-ok {
      color: #d9534f;
      font-weight: bold;
    }

    .target-no {
      color: #2e8b57;
      font-weight: bold;
    }

    .highlight {
      color: #d9534f;
      font-weight: bold;
      font-size: 1.15em;
    }

    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 25px 0;
    }

    .small {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>穿山惡龍目標價計算工具(半年內)</h2>

    <div class="warning">
      ⚠️ 本工具計算結果僅供參考。<br>
      投資有風險，請自行判斷並自負盈虧。HANK製作
    </div>

    <div class="input-group">
      <label>輸入股號或股名(首次查詢會較慢)：</label>
      <input type="text" id="stockNo" placeholder="例如 2330、台積電、3163、波若威">
    </div>

    <button id="searchBtn" onclick="autoDragon()">自動抓穿山惡龍</button>

    <div id="messageBox" class="result-box" style="display:none;"></div>

    <hr>

    <div class="input-group">
      <label>前波穿惡股價低點：</label>
      <input type="number" id="lowPrice" oninput="calculate()">
    </div>

    <div class="input-group">
      <label>前波穿惡股價高點：</label>
      <input type="number" id="highPrice" oninput="calculate()">
    </div>

    <div class="result-box">
      前波股價漲幅：
      <span id="displayA" class="highlight">0</span> %
    </div>

    <hr>

    <div class="input-group">
      <label>這波穿惡低點 X：</label>
      <input type="number" id="priceX" oninput="calculate()">
      <div id="priceXStatus" class="small"></div>
    </div>

    <div id="targetBox" class="result-box">
      穿山惡龍目標價：
      <span id="finalResult" class="highlight">0</span>
    </div>

    <div class="result-box quote-box">
      <div>目前股價：<span id="currentPriceDisplay" class="highlight">-</span></div>
      <div>20MA：<span id="ma20Display" class="highlight">-</span></div>
      <div>20MA狀態：<span id="ma20StatusDisplay" class="highlight">-</span></div>
      <div>當日漲跌：<span id="dayChangeDisplay" class="highlight">-</span></div>
      <div>當日漲幅：<span id="dayChangePercentDisplay" class="highlight">-</span>%</div>
      <div>成交量：<span id="volumeDisplay" class="highlight">-</span> 張</div>
      <div>距離目標價：<span id="targetDistanceDisplay" class="highlight">-</span>%</div>
      <div>是否達標：<span id="reachedTargetDisplay" class="highlight">-</span></div>
    </div>

    <div class="result-box">
      <div>第一次穿惡日期：<span id="crossDate1" class="highlight">-</span></div>
      <div>第一次穿惡低點：<span id="low1Display" class="highlight">-</span></div>
      <div>第一波最高點：<span id="high1Display" class="highlight">-</span></div>
      <div>第一波漲幅：<span id="gainDisplay" class="highlight">-</span>%</div>
      <div>跌破20MA日期：<span id="breakDate1" class="highlight">-</span></div>
      <div>最近一次穿惡日期：<span id="crossDate2" class="highlight">-</span></div>
      <div>最近一次穿惡低點：<span id="low2Display" class="highlight">-</span></div>
      <div class="small">條件：第一波低點到高點漲幅必須大於 25%</div>
    </div>
  </div>

  <script>
    let currentIsAboveMA20 = null;

    function calculate() {
      const low = parseFloat(document.getElementById('lowPrice').value);
      const high = parseFloat(document.getElementById('highPrice').value);
      const x = parseFloat(document.getElementById('priceX').value);
      const targetBox = document.getElementById('targetBox');

      let a = 0;

      if (low > 0 && high > 0) {
        a = ((high - low) / low) * 100;
        document.getElementById('displayA').innerText = a.toFixed(2);
      } else {
        document.getElementById('displayA').innerText = "0";
      }

      if (currentIsAboveMA20 === false) {
        document.getElementById('finalResult').innerText = "目前尚未穿惡";
        targetBox.className = 'result-box not-cross-box';
        return;
      }

      targetBox.className = 'result-box';

      if (!isNaN(x) && x > 0 && a > 25) {
        const factor = ((a + 100) / 100 * 0.5) + 1;
        const result = x * factor;

        document.getElementById('finalResult').innerText =
          result.toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });
      } else {
        document.getElementById('finalResult').innerText = "未成立";
      }
    }

    function clearOldData() {
      currentIsAboveMA20 = null;

      document.getElementById('lowPrice').value = '';
      document.getElementById('highPrice').value = '';
      document.getElementById('priceX').value = '';
      document.getElementById('priceX').disabled = false;
      document.getElementById('priceXStatus').innerText = '';

      document.getElementById('displayA').innerText = '0';
      document.getElementById('finalResult').innerText = '0';
      document.getElementById('targetBox').className = 'result-box';

      document.getElementById('currentPriceDisplay').innerText = '-';
      document.getElementById('ma20Display').innerText = '-';
      document.getElementById('ma20StatusDisplay').innerText = '-';
      document.getElementById('dayChangeDisplay').innerText = '-';
      document.getElementById('dayChangePercentDisplay').innerText = '-';
      document.getElementById('volumeDisplay').innerText = '-';
      document.getElementById('targetDistanceDisplay').innerText = '-';
      document.getElementById('reachedTargetDisplay').innerText = '-';
      document.getElementById('reachedTargetDisplay').className = 'highlight';

      document.getElementById('crossDate1').innerText = '-';
      document.getElementById('low1Display').innerText = '-';
      document.getElementById('high1Display').innerText = '-';
      document.getElementById('gainDisplay').innerText = '-';
      document.getElementById('breakDate1').innerText = '-';
      document.getElementById('crossDate2').innerText = '-';
      document.getElementById('low2Display').innerText = '-';
    }

    async function autoDragon() {
      const stockNo = document.getElementById('stockNo').value.trim();
      const btn = document.getElementById('searchBtn');
      const box = document.getElementById('messageBox');

      if (!stockNo) {
        alert('請輸入股號或股名');
        return;
      }

      btn.disabled = true;
      btn.innerText = '查詢中...';

      clearOldData();

      box.style.display = 'block';
      box.className = 'result-box';
      box.innerHTML = '正在抓取日K、即時行情並計算20MA...';

      try {
        const res = await fetch(`/api/dragon?stockNo=${encodeURIComponent(stockNo)}`);
        const data = await res.json();

        currentIsAboveMA20 =
          data.isAboveMA20 === true
            ? true
            : data.isAboveMA20 === false
              ? false
              : null;

        showQuoteData(data);

        if (!data.ok) {
          box.className = 'result-box fail-box';
          box.innerHTML = data.message || '查詢失敗';
          calculate();
          return;
        }

        box.className = currentIsAboveMA20 === false
          ? 'result-box fail-box'
          : 'result-box';

        box.innerHTML =
          `查詢標的：<strong>${data.displayName}</strong><br>` +
          (
            currentIsAboveMA20 === false
              ? `目前股價仍在20MA之下，尚未穿惡，因此不顯示這波穿惡低點X與目標價。`
              : `符合穿山惡龍條件，已自動帶入三個價位。`
          );

        document.getElementById('lowPrice').value = data.low1;
        document.getElementById('highPrice').value = data.high1;

        if (currentIsAboveMA20 === false) {
          document.getElementById('priceX').value = '';
          document.getElementById('priceX').disabled = true;
          document.getElementById('priceXStatus').innerText = '目前尚未穿惡，暫不帶入 X。';
        } else {
          document.getElementById('priceX').value = data.low2;
          document.getElementById('priceX').disabled = false;
          document.getElementById('priceXStatus').innerText = '';
        }

        document.getElementById('crossDate1').innerText = data.crossDate1 || '-';
        document.getElementById('low1Display').innerText = formatNumber(data.low1);
        document.getElementById('high1Display').innerText = formatNumber(data.high1);
        document.getElementById('gainDisplay').innerText = formatNumber(data.gainPercent);
        document.getElementById('breakDate1').innerText = data.breakDate1 || '-';

        document.getElementById('crossDate2').innerText =
          currentIsAboveMA20 === false
            ? '目前尚未穿惡'
            : data.crossDate2 || '-';

        document.getElementById('low2Display').innerText =
          currentIsAboveMA20 === false
            ? '目前尚未穿惡'
            : formatNumber(data.low2);

        calculate();

      } catch (err) {
        console.error(err);
        box.className = 'result-box fail-box';
        box.innerHTML = '系統錯誤，請稍後再試';
      } finally {
        btn.disabled = false;
        btn.innerText = '自動抓穿山惡龍';

        document.getElementById('stockNo').focus();
        document.getElementById('stockNo').select();
      }
    }

    function showQuoteData(data) {
      document.getElementById('currentPriceDisplay').innerText =
        formatNumber(data.currentPrice);

      document.getElementById('ma20Display').innerText =
        formatNumber(data.latestMA20);

      document.getElementById('ma20StatusDisplay').innerText =
        data.ma20Status || '-';

      document.getElementById('dayChangeDisplay').innerText =
        formatSignedNumber(data.dayChange);

      document.getElementById('dayChangePercentDisplay').innerText =
        formatSignedNumber(data.dayChangePercent);

      document.getElementById('volumeDisplay').innerText =
        formatNumber(data.volume);

      document.getElementById('targetDistanceDisplay').innerText =
        data.targetDistancePercent === null || data.targetDistancePercent === undefined
          ? '-'
          : formatSignedNumber(data.targetDistancePercent);

      const reachedEl = document.getElementById('reachedTargetDisplay');

      if (data.reachedTarget === null || data.reachedTarget === undefined) {
        reachedEl.innerText =
          data.isAboveMA20 === false ? '尚未穿惡' : '-';
        reachedEl.className = 'highlight';
      } else if (data.reachedTarget) {
        reachedEl.innerText = '已達標';
        reachedEl.className = 'target-ok';
      } else {
        reachedEl.innerText = '未達標';
        reachedEl.className = 'target-no';
      }
    }

    function formatNumber(value) {
      if (value === null || value === undefined || value === '') return '-';

      const n = Number(value);

      if (!Number.isFinite(n)) return '-';

      return n.toLocaleString(undefined, {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    function formatSignedNumber(value) {
      if (value === null || value === undefined || value === '') return '-';

      const n = Number(value);

      if (!Number.isFinite(n)) return '-';

      return (n > 0 ? '+' : '') + n.toLocaleString(undefined, {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      });
    }

    document.getElementById('stockNo').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        autoDragon();
      }
    });
  </script>
</body>
</html>
